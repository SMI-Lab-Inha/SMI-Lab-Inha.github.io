name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sitemap dates each page from the last commit that
          # touched its content, and a shallow clone would date them all alike.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check, build, and validate
        run: npm run validate

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Tell IndexNow what changed, once the pages are actually live. Running this
  # before the deploy would invite engines to fetch the previous build.
  #
  # Bing, Naver, Yandex and Seznam share the endpoint; Google does not take part,
  # so this supplements the sitemap rather than replacing it. Naver is the slowest
  # crawler of the three the site is verified with, and the one this helps most.
  #
  # Never allowed to fail the workflow: the deploy has already succeeded by this
  # point, and the sitemap still advertises every page regardless.
  index-now:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the same reason the build job needs it: the walk
          # that decides which routes changed reads the repository, not the diff.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs --before "$BEFORE" --after "$AFTER"
        env:
          # Absent on workflow_dispatch, which the script reads as "no previous
          # state" and submits the full list once.
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
